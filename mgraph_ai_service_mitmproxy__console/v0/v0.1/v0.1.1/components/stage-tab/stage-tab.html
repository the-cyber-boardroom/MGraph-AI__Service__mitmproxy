<!-- ═══════════════════════════════════════════════════════════════════════════════
   MitmProxy Simulator - Stage Tab Template
   v0.1.1 - Improved layout with better field separation and previews on both sides
   ═══════════════════════════════════════════════════════════════════════════════ -->

<div class="stage-tab-container">
    <!-- Stage Header -->
    <div class="stage-tab-header">
        <div class="stage-tab-title">
            <span class="stage-icon" id="stage-icon">⏳</span>
            <span class="stage-name" id="stage-name">Stage</span>
            <span class="stage-status badge" id="stage-status">idle</span>
        </div>
        <div class="stage-timing" id="stage-timing">-</div>
    </div>

    <!-- Content Area: Side-by-side Input/Output -->
    <div class="stage-tab-content" id="stage-content">
        <!-- Input Panel -->
        <div class="stage-panel input-panel">
            <div class="panel-header">
                <span class="panel-icon">📥</span>
                <span class="panel-title">INPUT</span>
                <div class="panel-tabs">
                    <button class="panel-tab-btn active" data-view="payload">Payload</button>
                    <button class="panel-tab-btn" data-view="body">Body</button>
                    <button class="panel-tab-btn" data-view="preview">Preview</button>
                </div>
            </div>
            <div class="panel-content">
                <div class="panel-view active" id="input-payload">
                    <div class="code-block code-highlighted" id="input-payload-code">No data</div>
                </div>
                <div class="panel-view" id="input-body">
                    <div class="code-block code-highlighted" id="input-body-code">No data</div>
                </div>
                <div class="panel-view" id="input-preview">
                    <iframe class="preview-frame" id="input-preview-frame" sandbox="allow-same-origin"></iframe>
                </div>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="stage-panel output-panel">
            <div class="panel-header">
                <span class="panel-icon">📤</span>
                <span class="panel-title">OUTPUT</span>
                <div class="panel-tabs">
                    <button class="panel-tab-btn active" data-view="response">Response</button>
                    <button class="panel-tab-btn" data-view="body">Body</button>
                    <button class="panel-tab-btn" data-view="preview">Preview</button>
                </div>
            </div>
            <div class="panel-content">
                <div class="panel-view active" id="output-response">
                    <div class="code-block code-highlighted" id="output-response-code">No data</div>
                </div>
                <div class="panel-view" id="output-body">
                    <div class="code-block code-highlighted" id="output-body-code">No data</div>
                </div>
                <div class="panel-view" id="output-preview">
                    <iframe class="preview-frame" id="output-preview-frame" sandbox="allow-same-origin"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div class="stage-empty" id="stage-empty">
        <div class="empty-icon">📭</div>
        <p class="empty-text">No data yet</p>
        <p class="empty-hint">Execute a flow to see stage details</p>
    </div>
</div>
