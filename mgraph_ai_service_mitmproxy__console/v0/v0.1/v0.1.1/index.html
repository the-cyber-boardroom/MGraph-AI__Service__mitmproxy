<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MitmProxy Simulator v0.1.1</title>
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="css/common.css">
    
    <style>
        /* App Layout */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .app-header {
            flex-shrink: 0;
        }
        
        .app-main {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        
        .app-main mitmproxy-simulator {
            display: block;
            height: 100%;
        }
        
        /* Loading State */
        .app-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
        }
        
        .app-loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-default);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .app-loading-text {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .app-loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <top-nav></top-nav>
        </header>
        
        <!-- Main Content -->
        <main class="app-main">
            <!-- Loading indicator shown until components are ready -->
            <div class="app-loading" id="app-loading">
                <div class="app-loading-spinner"></div>
                <div class="app-loading-text">Loading MitmProxy Simulator...</div>
            </div>
            
            <!-- Main simulator component -->
            <mitmproxy-simulator></mitmproxy-simulator>
        </main>
    </div>
    
    <!-- ═══════════════════════════════════════════════════════════════════════════
         Scripts - Load Order Matters!
         ═══════════════════════════════════════════════════════════════════════════ -->
    
    <!-- 1. Utilities (no dependencies) -->
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/syntax-highlight.js"></script>
    
    <!-- 2. Component Infrastructure -->
    <script src="components/_base/component-paths.js"></script>
    <script src="components/_base/base-component.js"></script>
    
    <!-- 3. Services -->
    <script src="js/services/api-client.js"></script>
    <script src="js/sample-html.js"></script>
    
    <!-- 4. Leaf Components (no child components) -->
    <script src="components/top-nav/top-nav.js"></script>
    <script src="components/stage-tab/stage-tab.js"></script>
    
    <!-- 5. Container Components -->
    <script src="components/simulator-config/simulator-config.js"></script>
    <script src="components/pipeline-status/pipeline-status.js"></script>
    <script src="components/details-panel/details-panel.js"></script>
    
    <!-- 6. Orchestrator -->
    <script src="components/mitmproxy-simulator/mitmproxy-simulator.js"></script>
    
    <!-- 7. App Initialization -->
    <script>
        // Wait for all custom elements to be defined
        async function initApp() {
            const components = [
                'top-nav',
                'stage-tab',
                'simulator-config',
                'pipeline-status',
                'details-panel',
                'mitmproxy-simulator'
            ];
            
            try {
                // Wait for all components to be defined
                await Promise.all(
                    components.map(name => customElements.whenDefined(name))
                );
                
                // Hide loading indicator
                const loadingEl = document.getElementById('app-loading');
                if (loadingEl) {
                    loadingEl.classList.add('hidden');
                }
                
                console.log('[App] MitmProxy Simulator v0.1.1 loaded');
                
            } catch (error) {
                console.error('[App] Failed to initialize:', error);
                const loadingEl = document.getElementById('app-loading');
                if (loadingEl) {
                    loadingEl.innerHTML = `
                        <div style="color: var(--accent-error);">⚠️ Failed to load components</div>
                        <div style="color: var(--text-muted); font-size: 12px;">${error.message}</div>
                    `;
                }
            }
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
