name: CI Pipeline (Base)

on:
  workflow_call:
    inputs:
      git_branch:
        required: true
        type: string
      release_type:
        required: false
        type: string
        default: ""
      target_deploy:
        required: true
        type: string
      should_increment_tag:
        required: false
        type: boolean
        default: false
      deploy_to_aws:
        required: false
        type: boolean
        default: true
    secrets:
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_DEFAULT_REGION:
        required: false
      AWS_ACCOUNT_ID:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      FAST_API__AUTH__API_KEY__NAME:
        required: false
      FAST_API__AUTH__API_KEY__VALUE:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  PACKAGE_NAME      : 'mgraph_ai_service_mitmproxy'
  DOCKERHUB_USERNAME: 'diniscruz'
  IMAGE_NAME        : 'mgraph-ai-service-mitmproxy'
  REGISTRY_IMAGE    : 'diniscruz/mgraph-ai-service-mitmproxy'

jobs:
  run-tests:
    name: "Run tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Local Stack
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/docker__local-stack@dev
        with:
          LOCAL_STACK_SERVICES: 's3,lambda,iam,logs,ec2'

      - name: "run-tests"
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/pytest__run-tests@dev
        with:
          test_target: "tests/unit"
        env:
          FAST_API__AUTH__API_KEY__NAME: 'api-key__in_github_test'
          FAST_API__AUTH__API_KEY__VALUE: 'this-is-the-value-of-the-api-key'
          AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__BASE_URL : ${{ secrets.AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__BASE_URL  }}
          AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__KEY_NAME : ${{ secrets.AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__KEY_NAME  }}
          AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__KEY_VALUE: ${{ secrets.AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__KEY_VALUE }}

  increment-tag:
    # Always define this job, but skip the actual tag increment step conditionally
    name: Increment Tag
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@v4

      - name: Increment Tag
        if: inputs.should_increment_tag
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__increment-tag@dev
        with:
          release_type: ${{ inputs.release_type }}

      - name: Skip Tag Increment
        if: '!inputs.should_increment_tag'
        run: echo "✅ Skipping tag increment for ${{ inputs.target_deploy }} deployment"

  check-aws-credentials:
    name: Check AWS Credentials
    runs-on: ubuntu-latest
    needs: run-tests
    outputs:
      has-credentials: ${{ steps.check.outputs.has-credentials }}
    steps:
      - name: Check if AWS credentials are configured
        id: check
        run: |
          if [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]] && \
             [[ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]] && \
             [[ -n "${{ secrets.AWS_DEFAULT_REGION }}" ]] && \
             [[ -n "${{ secrets.AWS_ACCOUNT_ID }}" ]]; then
            echo "has-credentials=true" >> $GITHUB_OUTPUT
            echo "✅ AWS credentials are configured"
          else
            echo "has-credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️  AWS credentials are not configured - deployment will be skipped"
          fi

  aws_deploy_lambda:
    if: |
      needs.check-aws-credentials.outputs.has-credentials == 'true' && 
      inputs.deploy_to_aws

    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    needs: [check-aws-credentials, increment-tag]  # Now this works because increment-tag always runs
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Service Lambda function
        uses: ./.github/actions/aws__deploy__lambda
        env:
          AWS_SECRET_ACCESS_KEY                                : ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION                                   : ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCOUNT_ID                                       : ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID                                    : ${{ secrets.AWS_ACCESS_KEY_ID }}
          FAST_API__AUTH__API_KEY__NAME                        : ${{ secrets.FAST_API__AUTH__API_KEY__NAME }}
          FAST_API__AUTH__API_KEY__VALUE                       : ${{ secrets.FAST_API__AUTH__API_KEY__VALUE }}
          AUTH__TARGET_SERVER__CACHE_SERVICE__BASE_URL         : ${{ secrets.AUTH__TARGET_SERVER__CACHE_SERVICE__BASE_URL          }}
          AUTH__TARGET_SERVER__CACHE_SERVICE__KEY_NAME         : ${{ secrets.AUTH__TARGET_SERVER__CACHE_SERVICE__KEY_NAME          }}
          AUTH__TARGET_SERVER__CACHE_SERVICE__KEY_VALUE        : ${{ secrets.AUTH__TARGET_SERVER__CACHE_SERVICE__KEY_VALUE         }}
          AUTH__TARGET_SERVER__HTML_SERVICE__BASE_URL          : ${{ secrets.AUTH__TARGET_SERVER__HTML_SERVICE__BASE_URL           }}
          AUTH__TARGET_SERVER__HTML_SERVICE__KEY_NAME          : ${{ secrets.AUTH__TARGET_SERVER__HTML_SERVICE__KEY_NAME           }}
          AUTH__TARGET_SERVER__HTML_SERVICE__KEY_VALUE         : ${{ secrets.AUTH__TARGET_SERVER__HTML_SERVICE__KEY_VALUE          }}
          AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__BASE_URL : ${{ secrets.AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__BASE_URL  }}
          AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__KEY_NAME : ${{ secrets.AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__KEY_NAME  }}
          AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__KEY_VALUE: ${{ secrets.AUTH__TARGET_SERVER__SEMANTIC_TEXT_SERVICE__KEY_VALUE }}
          AUTH__TARGET_SERVER__HTML_GRAPH_SERVICE__BASE_URL    : ${{ secrets.AUTH__TARGET_SERVER__HTML_GRAPH_SERVICE__BASE_URL     }}
          AUTH__TARGET_SERVER__HTML_GRAPH_SERVICE__KEY_NAME    : ${{ secrets.AUTH__TARGET_SERVER__HTML_GRAPH_SERVICE__KEY_NAME     }}
          AUTH__TARGET_SERVER__HTML_GRAPH_SERVICE__KEY_VALUE   : ${{ secrets.AUTH__TARGET_SERVER__HTML_GRAPH_SERVICE__KEY_VALUE    }}


          WCF_SERVICE__AUTH__API_KEY__NAME                     : ${{ secrets.WCF_SERVICE__AUTH__API_KEY__NAME                      }}
          WCF_SERVICE__AUTH__API_KEY__VALUE                    : ${{ secrets.WCF_SERVICE__AUTH__API_KEY__VALUE                     }}
        with:
          target: ${{ inputs.target_deploy }}

  check-dockerhub-credentials:
    name: Check Docker Hub Credentials
    runs-on: ubuntu-latest
    needs: run-tests
    outputs:
      has-credentials: ${{ steps.check.outputs.has-credentials }}
    steps:
      - name: Check if Docker Hub token is configured
        id: check
        run: |
          if [[ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "has-credentials=true" >> $GITHUB_OUTPUT
            echo "✅ Docker Hub token is configured"
          else
            echo "has-credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️  DOCKERHUB_TOKEN is not configured - Docker Hub push will be skipped"
          fi

  docker_push:
    if: needs.check-dockerhub-credentials.outputs.has-credentials == 'true'
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [check-dockerhub-credentials, increment-tag]   # increment-tag always runs, so version file is up to date
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_branch }}

      - name: Git Update Current Branch
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__update_branch@dev

      - name: Read service version
        id: version
        run: echo "version=$(cat ${{ env.PACKAGE_NAME }}/version)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context    : .
          file       : Dockerfile
          platforms  : linux/amd64
          push       : true
          cache-from : type=gha,scope=amd64
          cache-to   : type=gha,scope=amd64,mode=max
          tags       : |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY_IMAGE }}:latest

      - name: Inspect published image
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.version.outputs.version }}